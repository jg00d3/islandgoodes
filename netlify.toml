[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

# Edge function to protect admin pages
[[edge_functions]]
  path = "/admin/*"
  function = "admin-auth"

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"

    # Clickjacking protection
    X-Frame-Options = "SAMEORIGIN"

    # XSS Protection (legacy but still useful)
    X-XSS-Protection = "1; mode=block"

    # Referrer Policy
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Permissions Policy (restrict features)
    Permissions-Policy = "geolocation=(self), microphone=(), camera=(), payment=()"

    # Content Security Policy
    # Note: 'unsafe-inline' is required for Astro framework inline scripts
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://maps.googleapis.com https://translate.google.com https://cdn.jsdelivr.net https://unpkg.com https://translate.googleapis.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://translate.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https:;
      frame-src 'self' https://www.youtube.com https://my.matterport.com https://v2.reservationkey.com https://translate.google.com;
      connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://*.basemaps.cartocdn.com https://*.netlify.app https://translate.googleapis.com wss:;
      media-src 'self' https:;
      object-src 'none';
      base-uri 'self';
      form-action 'self' https://v2.reservationkey.com;
      frame-ancestors 'self';
      upgrade-insecure-requests;
    """
