name: Daily Island Pulse

on:
  schedule:
    # Daily at 4:00 PM UTC (6:00 AM HST / 11:00 AM EST)
    - cron: '0 16 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Island Pulse article
        run: |
          RESPONSE=$(curl -s -X POST "https://islandgoodes.com/.netlify/functions/generate-island-pulse")
          echo "Response: $RESPONSE"
          # Continue even if generation fails — build will use existing articles

      - name: Wait for article to be stored
        run: sleep 15

      - name: Trigger Netlify Build
        run: curl -X POST -d {} "${{ secrets.NETLIFY_BUILD_HOOK }}"
