    - cron: '0 16 * * *'
    # Weekly on Mondays at 5:00 PM UTC (7:00 AM HST / 12:00 PM EST)
    - cron: '0 17 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub UI

